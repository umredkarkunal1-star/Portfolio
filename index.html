<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.add('has-js');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kunal's — Portfolio</title>
    <meta name="description" content="Portfolio of Kunal Umredkar, BCA 2nd Year student, Web Developer, and Cybersecurity Enthusiast. Explore my projects, skills, and get in touch for collaborations.">
    <meta name="keywords" content="Kunal Umredkar, Web Developer, Cybersecurity, Portfolio, BCA Student, Data Analyst, India">
    <meta name="author" content="Kunal Umredkar">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kunal Umredkar | Portfolio">
    <meta property="og:description" content="Personal portfolio of Kunal Umredkar - BCA Student, Web Developer, and Cybersecurity Enthusiast.">
    <meta property="og:url" content="https://kunalumredkar.dev/"> <!-- Placeholder URL -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&family=Slabo+13px&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/style.css">
    
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
</head>
<body>
    <div id="site-loader" class="site-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
        <div class="site-loader__panel">
            <div class="site-loader__animation" aria-hidden="true">
                <p class="site-loader__label">Loading</p>
                <div class="site-loader__words">
                    <div class="site-loader__word-list">
                        <span>buttons</span>
                        <span>forms</span>
                        <span>switches</span>
                        <span>cards</span>
                        <span>buttons</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="root"></div>

    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
        (() => {
            const loader = document.getElementById('site-loader');
            if (!loader) return;

            const minimumDisplayTime = 5000;
            const loaderStartedAt = performance.now();
            let pageLoaded = document.readyState === 'complete';
            let appReady = false;
            let minimumTimeElapsed = false;
            let hideTimer;

            const hideWhenReady = () => {
                if (!pageLoaded || !appReady) return;
                if (minimumTimeElapsed) {
                    loader.classList.add('site-loader--hidden');
                    return;
                }

                if (hideTimer) return;
                const remainingTime = minimumDisplayTime - (performance.now() - loaderStartedAt);
                hideTimer = window.setTimeout(() => {
                    minimumTimeElapsed = true;
                    hideWhenReady();
                }, Math.max(0, remainingTime));
            };

            window.addEventListener('load', () => {
                pageLoaded = true;
                hideWhenReady();
            }, { once: true });
            window.addEventListener('portfolio:ready', () => {
                appReady = true;
                hideWhenReady();
            }, { once: true });

            document.querySelector('script[type="module"][src="/src/main.jsx"]')
                ?.addEventListener('error', () => {
                    appReady = true;
                    hideWhenReady();
                }, { once: true });

            hideWhenReady();
        })();
    </script>
</body>
</html>
